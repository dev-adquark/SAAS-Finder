name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.saas-finder.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      # Build without a database: the public site must render from the editorial seed.
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saasfinder_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI database only.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saasfinder_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saasfinder_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_API_KEY: ci-admin-key-0123456789abcdef
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      # migrate deploy + seed + integration tests (CRUD, publish gate, pricing workflow, cron, sponsors, analytics)
      - run: npm run test:db
      - run: npm run build
      - name: Crawl QA and end-to-end journeys
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3000 npm run test:e2e
          BASE_URL=http://localhost:3000 npm run test:admin-e2e
